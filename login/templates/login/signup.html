{% extends "index.html" %}
{% load static %}

{% block css_link %}
    <link rel="stylesheet" href="{% static 'css/signup.css' %}" />
{% endblock %}

{% block signup %}
  <div class="auth-body">
    <div class="top-nav">
      <div class="brand-mark">
        <span class="mark"></span>
        <span>signup</span>
      </div>
      <a href="{% url 'home' %}" class="back-link"><span class="arrow">&#8592;</span> Back to site</a>
    </div>

    <main class="auth-shell">
      <section class="auth-side">
        <span class="eyebrow">Join</span>
        <h1>Build your<br /><em>portfolio</em> here</h1>
        <p class="lede">
          Create an account
        </p>
      </section>

      <section class="auth-card-wrap">
        <form class="auth-card" id="signupForm" method="post" novalidate>
          {% csrf_token %}
          <h2>Create account</h2>
          <br>

          <div class="form-banner" id="formBanner"></div>

          <div class="field">
            <label for="username">User Name</label>
            <div class="control">
              <input type="text" id="username" name="username" placeholder="Your username" autocomplete="name" />
            </div>
            <div class="hint" id="usernameHint"></div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="control">
              <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" />
              <button type="button" class="icon-btn" id="togglePassword" aria-label="Show password">
                <i class="fa fa-eye"></i>
              </button>
            </div>
            <div class="strength-meter" id="strengthMeter">
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <div class="control">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" />
            </div>
            <div class="hint" id="confirmHint"></div>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="spinner"></span>
            <span class="btn-label">Create account</span>
          </button>

          <br>

          <p class="foot-note">Already have an account? <a href="{% url 'signin' %}" class="link-muted">Sign in</a></p>
        </form>
      </section>
    </main>
  </div>
{% endblock %}

{% block js_script %}
    <script src="{% static 'js/signup.js' %}"></script>
{% endblock %}
